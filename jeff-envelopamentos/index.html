<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeff Envelopamentos | Links Oficiais</title>
    <style>
        /* Cores baseadas na Logo: Preto Absoluto, Cinza Metálico e Vermelho Esportivo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000; /* Preto absoluto do fundo da logo */
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-top: 40px;
        }
        /* Configuração da Logo Redonda com Borda Vermelha */
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #e50914; /* Vermelho Esportivo da escrita Envelopamentos */
            object-fit: cover;
            margin-bottom: 20px;
            background-color: #000000;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.3);
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: 1px;
            color: #ffffff;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #b3b3b3; /* Cinza metálico do Skyline/Letras JEFF */
            font-weight: 600;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 1px solid #e50914;
            padding-bottom: 10px;
            display: inline-block;
        }
        /* Botões Estilo Fibra de Carbono / Preto Fosco */
        .btn-link {
            display: block;
            background-color: #111111;
            color: #e0e0e0;
            text-decoration: none;
            padding: 16px;
            margin-bottom: 18px;
            border-radius: 6px; /* Bordas levemente quadradas, estilo automotivo */
            border: 1px solid #222222;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        /* Efeito de Toque - Ativa o Vermelho e Brilho Neon */
        .btn-link:hover, .btn-link:active {
            background-color: #e50914; /* Vermelho */
            color: #ffffff;
            border-color: #e50914;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Puxa automaticamente a imagem logo.png que está na mesma pasta -->
        <img class="logo" src="logo.png" alt="Logo Jeff Envelopamentos">
        
        <h1>JEFF</h1>
        <div class="subtitle">Envelopamentos</div>

        <!-- Botões de Destino -->
        <a class="btn-link" href="https://wa.me" target="_blank">🟢 Falar no WhatsApp</a>
        <a class="btn-link" href="https://instagram.com" target="_blank">📸 Nosso Instagram</a>
        <a class="btn-link" href="https://g.page" target="_blank">⭐ Avalie nossa Oficina</a>
    </div>

</body>
</html>
