<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeff Envelopamentos | Links Oficiais</title>
    <style>
        /* Design Premium e Moderno */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f1115; /* Fundo Grafite Escuro */
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-top: 40px;
        }
        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #ff5500; /* Borda Laranja Esportiva */
            object-fit: cover;
            margin-bottom: 15px;
            background-color: #1a1d24;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #ff5500; /* Destaque em Laranja */
            font-weight: bold;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        /* Botões Estilizados */
        .btn-link {
            display: block;
            background-color: #1a1d24;
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid #2d323f;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        /* Efeito de Toque no Celular */
        .btn-link:hover, .btn-link:active {
            background-color: #ff5500;
            color: #ffffff;
            border-color: #ff5500;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ícone Provisório (Substitua depois pela sua logo real se quiser) -->
        <img class="logo" src="https://dicebear.com" alt="Logo Jeff Envelopamentos">
        
        <h1>Jeff Envelopamentos</h1>
        <div class="subtitle">Estética Automotiva & Comunicação</div>

        <!-- BOTÕES DE DESTINO (Ajuste os links reais depois se precisar) -->
        <a class="btn-link" href="https://wa.me" target="_blank">🟢 Falar no WhatsApp</a>
        <a class="btn-link" href="https://instagram.com" target="_blank">📸 Nosso Instagram</a>
        <a class="btn-link" href="https://github.io" target="_blank">🛠️ Ver Nosso Portfólio</a>
        <a class="btn-link" href="https://g.page" target="_blank">⭐ Avalie-nos no Google</a>

    </div>

</body>
</html>
